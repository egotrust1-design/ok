name: Build HardcoreCore
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Polish intro before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java')
          src = path.read_text()

          src = src.replace(
              'd.setDefaultBackground(false);\n            d.setLineWidth(240);',
              'd.setDefaultBackground(false);\n            d.setBackgroundColor(null);\n            d.setLineWidth(240);'
          )

          src = src.replace(
              'p.addPotionEffect(new PotionEffect(PotionEffectType.SLOWNESS, 20 * 60 * 10, 10, false, false, false));\n        p.teleport(introPlayerLocation(id));',
              'p.addPotionEffect(new PotionEffect(PotionEffectType.SLOWNESS, 20 * 60 * 10, 10, false, false, false));\n        p.addPotionEffect(new PotionEffect(PotionEffectType.BLINDNESS, 20 * 60 * 10, 0, false, false, false));\n        p.teleport(introPlayerLocation(id));'
          )

          src = src.replace(
              'p.removePotionEffect(PotionEffectType.SLOWNESS);',
              'p.removePotionEffect(PotionEffectType.SLOWNESS);\n        p.removePotionEffect(PotionEffectType.BLINDNESS);'
          )

          particle = r'''    private void startIntroParticles(Player p) {
        stopIntroParticles(p.getUniqueId());
        UUID id = p.getUniqueId();
        BukkitTask task = new BukkitRunnable() {
            @Override
            public void run() {
                if (!p.isOnline() || !introPlayers.contains(id)) {
                    cancel();
                    introParticleTasks.remove(id);
                    return;
                }
                Location b = p.getLocation();
                for (int i = 0; i < 55; i++) {
                    double x = b.getX() + (Math.random() * 14.0 - 7.0);
                    double z = b.getZ() + (Math.random() * 14.0 - 7.0);
                    double y = b.getY() + 2.5 + Math.random() * 8.5;
                    p.spawnParticle(Particle.WHITE_ASH, x, y, z, 1, 0.0, -0.16, 0.0, 0.0);
                }
                for (int i = 0; i < 18; i++) {
                    double x = b.getX() + (Math.random() * 8.0 - 4.0);
                    double z = b.getZ() + (Math.random() * 8.0 - 4.0);
                    double y = b.getY() + 1.5 + Math.random() * 5.0;
                    p.spawnParticle(Particle.WHITE_ASH, x, y, z, 1, 0.0, -0.20, 0.0, 0.0);
                }
            }
        }.runTaskTimer(this, 0L, 2L);
        introParticleTasks.put(id, task);
    }
'''
          src, count = re.subn(
              r'    private void startIntroParticles\(Player p\) \{.*?\n    private void stopIntroParticles',
              particle + '    private void stopIntroParticles',
              src,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('Could not replace startIntroParticles')

          book = r'''    private void openIntroductionBook(Player p) {
        ItemStack book = new ItemStack(org.bukkit.Material.WRITTEN_BOOK);
        BookMeta meta = (BookMeta) book.getItemMeta();
        meta.title(Component.text("Before You Enter"));
        meta.author(Component.text("Hardcore SMP"));
        meta.addPages(
                Component.text("You have one life. There is no second chance here. What happens next is up to you."),
                Component.text("Players can fight, steal, ally, betray, or survive alone. Trust carefully."),
                Component.text("Death is permanent. You are out unless an admin officially revives you."),
                Component.text("Explore. Build. Prepare. The world keeps secrets. Not everything dangerous announces itself."),
                Component.text("Protect your life. Protect your gear. And remember: nobody owes you safety."),
                Component.text("Ready? The world is waiting.")
                        .append(Component.text(" [ ENTER THE WORLD ]")
                                .color(TextColor.color(180, 30, 30))
                                .clickEvent(ClickEvent.runCommand("/hardcore intro")))
        );
        book.setItemMeta(meta);
        p.openBook(book);
    }
'''
          src, count = re.subn(
              r'    private void openIntroductionBook\(Player p\) \{.*?\n    private void completeIntroduction',
              book + '    private void completeIntroduction',
              src,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('Could not replace openIntroductionBook')

          click_handler = r'''    @EventHandler(priority = EventPriority.HIGHEST)
    public void onIntroLeftClick(org.bukkit.event.player.PlayerInteractEvent e) {
        Player p = e.getPlayer();
        if (!introPlayers.contains(p.getUniqueId())) return;
        if (e.getAction() == org.bukkit.event.block.Action.LEFT_CLICK_AIR
                || e.getAction() == org.bukkit.event.block.Action.LEFT_CLICK_BLOCK) {
            e.setCancelled(true);
            openIntroductionBook(p);
        }
    }

'''
          marker = '    @EventHandler(priority = EventPriority.HIGHEST, ignoreCancelled = true)\n    public void onIntroEntityInteract'
          if marker not in src:
              raise SystemExit('Could not find intro entity interact marker')
          src = src.replace(marker, click_handler + marker, 1)

          path.write_text(src)
          PY
      - name: Build
        run: |
          sed -i 's/,"HardcoreCore",false);/,"HardcoreCore");/' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java
          mvn -B -ntp clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreCore-1.0.0
          path: target/HardcoreCore-1.0.0.jar
