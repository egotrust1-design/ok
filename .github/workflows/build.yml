name: Build HardcoreCore
on:
  push:
    branches: [ main, build-fixed-artifact ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply clean intro v2
        run: python3 clean_intro_v2.py
      - name: Apply final intro stabilizer
        run: python3 final_intro_stabilizer.py
      - name: Verify generated source is clean
        run: |
          if grep -nE 'PlayerCommandPreprocessEvent|SOUL_FIRE_FLAME|WHITE_ASH|getSpawnPosInChunk|introBookOpen' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java; then
            echo 'Legacy intro implementation remains.'
            exit 1
          fi
          if grep -n 'p.spawnParticle' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java | grep -v 'Particle.FIREFLY'; then
            echo 'A non-FIREFLY intro particle call remains.'
            exit 1
          fi
          if ! grep -q 'ClickEvent.runCommand("/hardcore intro")' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java; then
            echo 'Enter-world click action is missing.'
            exit 1
          fi
          grep -q 'Type /rules in chat at any time' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java
          grep -q 'TextColor.color(0, 0, 0)' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java
          echo 'Final intro static verification passed.'
      - name: Build
        run: |
          sed -i 's/,"HardcoreCore",false);/,"HardcoreCore");/' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java
          mvn -B -ntp clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreCore-1.0.0-fixed
          path: target/HardcoreCore-1.0.0.jar
