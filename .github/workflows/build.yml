name: Build HardcoreCore
on:
  push:
    branches: [ main, build-fixed-artifact ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply intro safety patch
        run: python3 drop_safety_patch.py
      - name: Replace drop with random intro arrival
        run: python3 random_intro_patch.py
      - name: Apply corrected async intro arrival patch
        run: python3 async_arrival_patch_v2.py
      - name: Apply final vanilla intro arrival fix
        run: python3 final_intro_fix.py
      - name: Apply final hardcore fixes
        run: python3 last_hardcore_fix.py
      - name: Sanitize generated source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java')
          src = path.read_text()
          lines = src.splitlines(keepends=True)
          out = []
          for line in lines:
              if line.lstrip().startswith('@EventHandler') and out and out[-1].lstrip().startswith('@EventHandler'):
                  out[-1] = line
              else:
                  out.append(line)
          path.write_text(''.join(out))
          print('Generated source sanitized.')
          PY
      - name: Build
        run: |
          sed -i 's/,"HardcoreCore",false);/,"HardcoreCore");/' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java
          mvn -B -ntp clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreCore-1.0.0-fixed
          path: target/HardcoreCore-1.0.0.jar
