name: Build HardcoreCore
on:
  push:
    branches: [ main, build-fixed-artifact ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply clean intro and RTP base
        run: python3 last_hardcore_fix.py
      - name: Apply final clean intro fix
        run: python3 final_clean_intro_fix.py
      - name: Sanitize generated source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java')
          src = path.read_text()
          src = src.replace('import org.bukkit.event.player.PlayerCommandPreprocessEvent;\n', '')
          src = src.replace('Particle.WHITE_ASH', 'Particle.DUST')
          src = src.replace('Particle.SOUL_FIRE_FLAME', 'Particle.DUST')
          path.write_text(src)
          print('Generated source sanitized.')
          PY
      - name: Build
        run: |
          sed -i 's/,"HardcoreCore",false);/,"HardcoreCore");/' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java
          mvn -B -ntp clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreCore-1.0.0-fixed
          path: target/HardcoreCore-1.0.0.jar
