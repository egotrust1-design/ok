name: Build HardcoreCore
on:
  push:
    branches: [ main, build-fixed-artifact ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply stable intro/RTP rewrite
        run: python3 stable_intro_rewrite.py
      - name: Apply retry and rules cleanup
        run: python3 retry_rules_cleanup.py
      - name: Verify generated source is clean
        run: |
          if grep -nE 'PlayerCommandPreprocessEvent|SOUL_FIRE_FLAME|WHITE_ASH|getSpawnPosInChunk' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java; then
            echo 'Legacy intro implementation remains.'
            exit 1
          fi
          if grep -n 'p.spawnParticle' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java | grep -v 'Particle.FIREFLY'; then
            echo 'A non-FIREFLY intro particle call remains.'
            exit 1
          fi
          if grep -n '@EventHandler' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java | grep -q 'openRules'; then
            echo 'Invalid openRules event handler remains.'
            exit 1
          fi
      - name: Build
        run: |
          sed -i 's/,"HardcoreCore",false);/,"HardcoreCore");/' src/main/java/com/egotrust1/hardcorecore/HardcoreCore.java
          mvn -B -ntp clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: HardcoreCore-1.0.0-fixed
          path: target/HardcoreCore-1.0.0.jar
